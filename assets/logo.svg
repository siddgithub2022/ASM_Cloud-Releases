<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img">
<title>ASM_Cloud Logo</title>
<defs>
  <linearGradient id="asmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2E6FE0"/>
    <stop offset="100%" stop-color="#1A3FA0"/>
  </linearGradient>
  <linearGradient id="asmGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4A8AFF"/>
    <stop offset="100%" stop-color="#2E6FE0"/>
  </linearGradient>
</defs>
<!-- Icon: Cloud with stacked sheets / sync motif -->
<g transform="translate(12,18)">
  <!-- Shadow/base -->
  <rect x="6" y="78" width="96" height="10" rx="5" fill="#E6ECF5" opacity="0.9"/>
  <!-- Cloud shape -->
  <path d="M 28 72 C 8 72 2 52 18 38 C 22 18 44 10 60 22 C 74 8 96 12 102 30 C 118 30 120 56 102 68 C 102 68 100 72 92 72 Z" 
        fill="url(#asmGrad)" stroke="#1A3FA0" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cut / stacked layers inside cloud - represents file sync -->
  <g fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- three stacked sheets -->
    <path d="M 36 52 L 68 52 L 78 42 L 46 42 Z"/>
    <path d="M 36 60 L 72 60 L 82 50 L 46 50 Z"/>
    <path d="M 36 44 L 62 44"/>
  </g>
  <!-- Sync arrows circle -->
  <g transform="translate(84,74)">
    <circle cx="0" cy="0" r="18" fill="white" stroke="#D9E2F3" stroke-width="1.5"/>
    <path d="M -7 -4 A 10 10 0 0 1 7 -4" fill="none" stroke="#2E6FE0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 5 -8 L 7 -4 L 3 -2" fill="none" stroke="#2E6FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 7 4 A 10 10 0 0 1 -7 4" fill="none" stroke="#2E6FE0" stroke-width="2" stroke-linecap="round"/>
    <path d="M -5 8 L -7 4 L -3 2" fill="none" stroke="#2E6FE0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
<!-- Wordmark -->
<g font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="148" y="74" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#111827">ASM<tspan fill="#2E6FE0">_</tspan>Cloud</text>
  <text x="149" y="100" font-size="13.5" font-weight="500" letter-spacing="3.2" fill="#6B7280">PERSONAL CLOUD • SELF-HOSTED</text>
  <rect x="148" y="110" width="240" height="3" rx="1.5" fill="url(#asmGradLight)" opacity="0.95"/>
</g>
</svg>
